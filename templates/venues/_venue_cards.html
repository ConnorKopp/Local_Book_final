{% for venue in venues %}
  <div class="card mb-4 shadow-sm">
    <div class="card-body p-4">
      <h2 class="h4"><a href="{{ venue.get_absolute_url }}">{{ venue.name }}</a></h2>
      <p class="text-muted mb-2">{{ venue.city }} · Holds {{ venue.capacity }}</p>
      <p>{{ venue.description|truncatewords:30 }}</p>
      <p class="mb-0 fw-bold">
        {% if venue.price_per_hour %}${{ venue.price_per_hour }}/hour{% else %}Free{% endif %}
      </p>
    </div>
  </div>
{% endfor %}
