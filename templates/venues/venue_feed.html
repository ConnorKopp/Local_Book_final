{% extends "base.html" %}

{% block title %}Browse spaces{% endblock title %}

{% block header_buttons %}
  <a href="{% url 'home' %}" class="btn btn-outline-primary me-2">Home</a>
  {{ block.super }}
{% endblock header_buttons %}

{% block content %}
<div style="max-width: 640px; margin: 0 auto">
  <div id="feed"></div>
  <div id="sentinel" style="height: 1px"></div>
  <p id="feed-empty" class="text-center text-muted" hidden>
    No venues have been listed yet.
  </p>
</div>

<script>
  const feed = document.getElementById("feed");
  const sentinel = document.getElementById("sentinel");
  const emptyMessage = document.getElementById("feed-empty");
  const itemsUrl = "{% url 'venue_feed_items' %}";
  let page = 1;
  let loading = false;

  async function loadMore() {
    if (loading) return;
    loading = true;
    try {
      const response = await fetch(`${itemsUrl}?page=${page}`);
      const html = await response.text();
      if (!html.trim()) {
        observer.disconnect();
        emptyMessage.hidden = false;
        return;
      }
      feed.insertAdjacentHTML("beforeend", html);
      page += 1;
    } catch (error) {
      console.error("Could not load venues", error);
    } finally {
      loading = false;
    }
    
    observer.unobserve(sentinel);
    observer.observe(sentinel);
  }

  const observer = new IntersectionObserver(
    (entries) => {
      if (entries[0].isIntersecting) loadMore();
    },
    { rootMargin: "600px" }
  );
  observer.observe(sentinel);
</script>
{% endblock content %}
