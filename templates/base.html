{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Local Book{% endblock title %}</title>
    <link rel="stylesheet" href="{% static 'pages/styles.css' %}" />
  </head>
  <body>
    <header>
      <nav class="site-nav">
        {% block header_buttons %}
          {% if user.is_authenticated %}
            <span class="site-user">Welcome, {{ user.username }}</span>
            <a href="{% url 'venue_create' %}" class="button button--primary">List a venue</a>
            <form method="post" action="{% url 'logout' %}" class="inline-form">
              {% csrf_token %}
              <button type="submit" class="button button--secondary">Log out</button>
            </form>
          {% else %}
            <a href="{% url 'login' %}" class="button button--secondary">Log In</a>
            <a href="{% url 'signup' %}" class="button button--primary">Sign Up</a>
          {% endif %}
        {% endblock header_buttons %}
      </nav>
    </header>

    <main class="page-content">
      {% block content %}{% endblock content %}
    </main>
  </body>
</html>
