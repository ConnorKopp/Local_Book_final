{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Local Book{% endblock title %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="d-flex justify-content-between align-items-center px-5 py-3 bg-white">
      <a href="{% url 'home' %}">
        <img src="{% static 'pages/Local-Book-logo.png' %}" width="250" alt="Local Book home" />
      </a>
      <div>
        {%block header_buttons %}
          <a href="{% url 'login' %}" class="btn btn-outline-primary">Log In</a>
          <a href="{% url 'signup' %}" class="btn btn-primary">Sign Up</a>
        {%endblock header_buttons %}
      </div>
    </header>

    <main class="container py-5">
      {% block content %}{% endblock content %}
    </main>
  </body>
</html>
